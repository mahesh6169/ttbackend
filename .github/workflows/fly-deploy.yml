# See https://fly.io/docs/app-guides/continuous-deployment-with-github-actions/
# Deploys from mahesh6169/ttbackend since 2026-10-14 (the old ttbackendflyio repo's copy is disabled).

name: Fly Deploy
# Runs only after the CI workflow (ci.yml) has finished on main, and deploys
# only when it passed - a red main never reaches Fly.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
jobs:
  deploy:
    name: Deploy app
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    concurrency: deploy-group    # optional: ensure only one action runs at a time
    steps:
      # The exact commit CI tested, not whatever main is by now.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - run: flyctl deploy --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
